# ===================================================================
# AATHIRA MART - Smart Gadgets. Easy Shopping.
# Spring Boot 3 / Java 17 / MySQL 8 configuration
# ===================================================================

server.port=8080
spring.application.name=aathira-mart

# -------------------------------------------------------------------
# MySQL 8 datasource
# createDatabaseIfNotExist=true creates the database "aathira_mart"
# automatically the first time the application starts.
# Adjust username/password to match your local MySQL installation.
# -------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/aathira_mart?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&nullCatalogMeansCurrent=true
spring.datasource.username=root
spring.datasource.password=Aathira@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=20000

# -------------------------------------------------------------------
# JPA / Hibernate - schema is created automatically (ddl-auto=update)
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# -------------------------------------------------------------------
# JWT configuration
# IMPORTANT: replace app.jwt.secret with your own random string
# (at least 32 characters) in production.
# -------------------------------------------------------------------
app.jwt.secret=aathira-mart-jwt-signing-secret-key-change-me-9f4c2b7e1a8d6f305e2c9b4a7d1f8e6c3b0a5d9f
app.jwt.expiration-ms=86400000
app.reset.token-ttl-minutes=30

# -------------------------------------------------------------------
# Application
# -------------------------------------------------------------------
app.name=AATHIRA MART
app.tagline=Smart Gadgets. Easy Shopping.

logging.level.com.aathiramart=INFO
logging.level.org.springframework.security=WARN
